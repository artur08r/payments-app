# CI: на каждый PR и push в main собираем и тестируем то, что изменилось; в main — ещё образы в GHCR.
# Действия закреплены по SHA коммита (тег можно переписать задним числом), обновляет их Dependabot.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый коммит в ту же ветку PR останавливает старый запуск. В main запуски не отменяем: каждый коммит main
# должен получить свои образы.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# По умолчанию токену — только чтение; права на запись в реестр образов — у одной задачи images
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # Что изменилось. Правка libs/platform или самого CI затрагивает все Java-сервисы.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      platform: ${{ steps.detect.outputs.platform }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/changes.sh "$BASE"

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: mvn -B -ntp -f libs/platform/pom.xml verify

  # Каждый затронутый сервис — на своей машине параллельно: unit-тесты и интеграционные на Testcontainers
  # (Docker на машинах GitHub есть). fail-fast выключен: падение одного сервиса не прячет ошибки других.
  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: service (${{ matrix.service }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install libs/platform
        run: mvn -B -ntp -q -f libs/platform/pom.xml install -DskipTests
      - name: Build and test
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports
            services/${{ matrix.service }}/target/failsafe-reports
          retention-days: 7

  # Фронтенд: проверка типов TypeScript и сборка
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Известные уязвимости в зависимостях (pom.xml, package-lock.json). Отказ — только CRITICAL, у которых уже
  # есть исправленная версия: на то, что исправить нельзя, сборка не краснеет. Остальное — в отчёте.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Fail on fixable critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Одна обязательная проверка «всё зелёное»: пропущенные задачи (сервис не менялся) — не ошибка,
  # упавшие или отменённые — ошибка
  ci-ok:
    if: always()
    needs: [changes, platform, service, frontend, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI зелёный"

  # Только main, после зелёного CI: образ каждого изменённого сервиса → проверка уязвимостей → GHCR.
  # Тег — SHA коммита: в кластере будет ровно этот код. Слои Docker — в кэше GitHub Actions.
  images:
    needs: [changes, ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    name: image (${{ matrix.service }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Образ с исправимой CRITICAL-уязвимостью (в зависимостях или пакетах базового образа) в реестр не попадёт
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        run: docker push --all-tags ${{ env.REGISTRY }}/${{ matrix.service }}
