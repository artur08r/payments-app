# Всё приложение локально: Postgres, Kafka, микросервисы и фронтенд
x-quote-secret: &quote-secret
  QUOTE_SECRET: local-dev-quote-secret-change-me

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:9092 — для сервисов внутри docker, localhost:29092 — для подключения с компьютера
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Веб-интерфейс для просмотра топиков и сообщений: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  account:
    build: services/account
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  pricing:
    build: services/pricing
    environment:
      <<: *quote-secret
      DB_URL: jdbc:postgresql://postgres:5432/payments
      ACCOUNT_URL: http://account:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    build: services/payment
    environment:
      <<: *quote-secret
      DB_URL: jdbc:postgresql://postgres:5432/payments
      KAFKA_BOOTSTRAP: kafka:9092
      ACCOUNT_URL: http://account:8081
      FRAUD_URL: http://fraud:8084
      BILLER_URL: http://biller:8087
      PROCESSING_URL: http://processing:8085
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  history:
    build: services/history
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Справочники поставщиков: страны и способы переводов за рубеж
  biller:
    build: services/biller
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy

  fraud:
    build: services/fraud
    ports:
      - "8084:8084"

  processing:
    build: services/processing
    ports:
      - "8085:8085"

  web:
    build: frontend
    environment:
      ACCOUNT_URL: http://account:8081
      PRICING_URL: http://pricing:8082
      PAYMENT_URL: http://payment:8083
      HISTORY_URL: http://history:8086
      BILLER_URL: http://biller:8087
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
